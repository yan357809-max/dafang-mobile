<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大方云图 - 驾驶未来 · 全新出行</title>
    <meta name="description" content="大方云图 - 科技引领·驾驶无界·自在出行·解放双手">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: 'MiSans', 'Montserrat', 'Aidian FengYaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
            background-color: #000;
            padding-bottom: 80px;
        }
        
        ::-webkit-scrollbar { width: 0; height: 0; }
        
        /* 顶部导航栏 */
        .nav-bar {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* ===== Hero = 智能出行 ===== */
        .hero-section {
            position: relative;
            min-height: 50vh;
            background: url('images/hero-bg.avif') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 24px 60px;
            overflow: hidden;
        }
        
        .hero-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.3) 100%);
        }
        
        .hero-content {
            position: relative;
            z-index: 10;
        }
        
        /* Logo动画容器 - 与PC端一致 */
        .hero-logo-box {
            position: relative;
            width: 260px;
            height: 120px;
            margin: 0 auto 24px;
            background: url('images/first-logo.7c8743ef0acacea6b76e.png') center/contain no-repeat;
        }
        
        /* 蓝色三角形 - 300px宽，80px高，放在i字母上方 */
        .hero-triangle {
            position: absolute;
            width: 300px;
            height: 80px;
            left: calc(50% - 8px);
            top: calc(-10px + 8px);
            transform: translateX(-50%);
            z-index: 10;
            background: url('images/logo-animation.ba316c03838ebb056cac.png') center/contain no-repeat;
            filter: drop-shadow(0 0 15px rgba(100,179,244,0.9));
        }
        
        .hero-title {
            font-size: 32px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            letter-spacing: 6px;
        }
        
        .hero-subtitle {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 16px;
            letter-spacing: 4px;
        }
        
        .hero-desc {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            letter-spacing: 2px;
            margin-bottom: 24px;
        }
        
        /* Hero 文字渐显动画 */
        .hero-fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: heroFadeIn 0.8s ease forwards;
        }
        
        .hero-fade-in-delay-1 {
            animation-delay: 0.2s;
        }
        
        .hero-fade-in-delay-2 {
            animation-delay: 0.4s;
        }
        
        .hero-fade-in-delay-3 {
            animation-delay: 0.6s;
        }
        
        @keyframes heroFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 28px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 24px;
            color: white;
            font-size: 14px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        
        .btn-primary:active {
            background: rgba(255,255,255,0.25);
        }
        
        /* ===== 数智企业 ===== */
        .enterprise-section {
            position: relative;
            min-height: 50vh;
            background: url('images/enterprise-bg.avif') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 24px;
            overflow: hidden;
        }
        

        
        .enterprise-content {
            position: relative;
            z-index: 10;
            max-width: 400px;
        }
        
        .enterprise-title {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .enterprise-subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 6px;
        }
        
        .enterprise-desc {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 24px;
        }
        
        /* ===== 四大核心技术 ===== */
        .tech-section {
            position: relative;
            background: linear-gradient(180deg, #0a1628 0%, #1a2332 100%);
            padding: 32px 16px;
            min-height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .tech-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .tech-title {
            font-size: 22px;
            font-weight: 700;
            color: white;
            margin-bottom: 6px;
        }
        
        .tech-subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }
        
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: calc(100% - 32px);
            max-width: 400px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        
        .tech-item {
            position: relative;
            aspect-ratio: 16/10;
            border-radius: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px 12px 0 12px;
            text-decoration: none;
            background-size: cover;
            background-position: center;
            min-height: 100px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .tech-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.7) 100%);
            z-index: 1;
        }
        
        .tech-content {
            position: relative;
            z-index: 2;
        }
        
        .tech-name {
            font-size: 16px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        
        .tech-name-en {
            font-size: 12px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            font-weight: 400;
        }
        
        /* ===== 标语区 ===== */
        .slogan-section {
            background: #F8F8FF;
            padding: 40px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .slogan-content {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .slogan-brand {
            font-size: 85px;
            font-weight: 700;
            color: rgba(241, 241, 249, 0.4);
            letter-spacing: 8px;
            margin-bottom: -20px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: -1;
        }

        .slogan-text {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 4px;
            margin-bottom: 24px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #444;
            font-size: 12px;
        }

        .contact-item i {
            width: 14px;
            height: 14px;
            color: #2997ff;
        }
        
        /* ===== 底部导航 ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 22, 40, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
        }
        
        .nav-item { 
            color: rgba(255,255,255,0.5); 
            transition: all 0.2s ease; 
            text-decoration: none;
        }
        .nav-item.active { 
            color: #64b3f4; 
        }
        
        /* 侧边菜单 */
        .side-menu {
            background: rgba(10, 22, 40, 0.98);
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5);
        }
        
        .pb-safe { 
            padding-bottom: env(safe-area-inset-bottom, 20px); 
        }
    </style>
</head>

    <script>
        lucide.createIcons();
        
        // 菜单控制
        const menuBtn = document.getElementById('menuBtn');
        const sideMenu = document.getElementById('sideMenu');
        const menuContent = document.getElementById('menuContent');
        const menuOverlay = document.getElementById('menuOverlay');
        const closeMenu = document.getElementById('closeMenu');
        
        function openMenu() {
            sideMenu.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            setTimeout(() => { menuContent.classList.remove('translate-x-full'); }, 10);
        }
        
        function closeMenuFn() {
            menuContent.classList.add('translate-x-full');
            setTimeout(() => { sideMenu.classList.add('hidden'); document.body.style.overflow = ''; }, 300);
        }
        
        menuBtn.addEventListener('click', openMenu);
        closeMenu.addEventListener('click', closeMenuFn);
        menuOverlay.addEventListener('click', closeMenuFn);
        document.querySelectorAll('#sideMenu a').forEach(link => { link.addEventListener('click', closeMenuFn); });
        
        // Logo动画 - 每次滑动到hero区域触发
        const heroSection = document.querySelector('.hero-section');
        const logosContainer = document.querySelector('.hero-logos-container');
        let hasAnimated = false;
        
        // 使用 Intersection Observer 检测hero区域是否进入视口
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                    // 每次进入视口都触发动画
                    triggerLogoAnimation();
                }
            });
        }, {
            threshold: 0.5 // 当50%的hero区域可见时触发
        });
        
        observer.observe(heroSection);
        
        function triggerLogoAnimation() {
            // 重置动画
            logosContainer.classList.remove('animating');
            logosContainer.style.animation = 'none';
            
            // 强制重绘
            logosContainer.offsetHeight;
            
            // 重新启动动画
            logosContainer.style.animation = '';
            logosContainer.classList.add('animating');
        }
        
        // 页面加载时也触发一次动画
        window.addEventListener('load', () => {
            setTimeout(triggerLogoAnimation, 500);
        });
        

    </script>
